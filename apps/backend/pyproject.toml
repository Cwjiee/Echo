[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_any_generics = false
check_untyped_defs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
