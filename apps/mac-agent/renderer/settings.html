<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
  <title>Echo Agent — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 24px;
    }
    h1 { font-size: 18px; margin-bottom: 20px; color: #cba6f7; }
    label {
      display: block;
      margin-bottom: 4px;
      color: #a6adc8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 6px;
      color: #cdd6f4;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #cba6f7; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; }
    .checkbox-row label { margin: 0; text-transform: none; font-size: 13px; }
    button {
      width: 100%;
      padding: 10px;
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #b4befe; }
    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #a6e3a1;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>⚡ Echo Agent Settings</h1>

  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://localhost:8000" />

  <label for="authToken">Auth Token</label>
  <input type="password" id="authToken" placeholder="Enter your agent token" />

  <label for="workspace">Workspace</label>
  <input type="text" id="workspace" placeholder="default" />

  <div class="checkbox-row">
    <input type="checkbox" id="autoConnect" />
    <label for="autoConnect">Auto-connect on launch</label>
  </div>

  <button id="saveBtn">Save &amp; Connect</button>
  <div id="status"></div>

  <script>
    const api = window.echoAPI;
    const $status = document.getElementById('status');

    async function loadSettings() {
      const s = await api.getSettings();
      document.getElementById('backendUrl').value = s.backendUrl || '';
      document.getElementById('authToken').value = s.authToken || '';
      document.getElementById('workspace').value = s.workspace || 'default';
      document.getElementById('autoConnect').checked = s.autoConnect || false;
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const settings = {
        backendUrl: document.getElementById('backendUrl').value.trim(),
        authToken: document.getElementById('authToken').value.trim(),
        workspace: document.getElementById('workspace').value.trim() || 'default',
        autoConnect: document.getElementById('autoConnect').checked,
      };
      await api.saveSettings(settings);
      api.connect();
      $status.textContent = '⏳ Connecting...';
    });

    api.onStatusChange((status) => {
      $status.textContent = status;
    });

    loadSettings();
  </script>
</body>
</html>
